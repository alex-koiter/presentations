<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  
  $if(workshop)$
  <p class="absolute" style="top:0">$workshop$</p>
  $endif$
  
  $if(caption)$
  <p style="position:absolute;top:0;right:0;color:grey;font-size:60%;text-align:right">$caption$</p>
  $endif$
  
  <h1 class="title" style="padding-top: 30px">$title$</h1>
  $if(subtitle)$
  <h3 class="subtitle" style="padding-top:5px;"><strong>$subtitle$</strong></h3>
  $endif$
  
  $if(author-alex)$
  <p style="font-size:70%; padding-top: 550px">
  </p>
  $endif$
  
  $for(author)$
  <p class="author">$author$</p>
  $endfor$
  
  $for(institute)$
  <p class="institute">$institute$</p>
  $endfor$
  
  $if(date)$
  <p class="date">Compiled: $date$</p>
  $endif$
</section>
